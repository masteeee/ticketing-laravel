version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: keloola-ticketing-app
    container_name: keloola-ticketing-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - keloola-ticketing
    depends_on:
      - db
  
  nginx:
    image: nginx:1.25-alpine
    container_name: keloola-ticketing-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - keloola-ticketing
    depends_on:
      - app
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  db:
    image: postgres:15
    container_name: keloola-ticketing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keloola
      POSTGRES_USER: keloola
      POSTGRES_PASSWORD: keloola
    ports:
      - "5432:5432"
    volumes:
      - keloola-ticketing-pgdata:/var/lib/postgresql/data
    networks:
      - keloola-ticketing

  node:
    image: node:20-alpine
    container_name: keloola-ticketing-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - keloola-ticketing
    command: sh -c "npm install && npm run build"
    depends_on:
      - app

networks:
  keloola-ticketing:
    driver: bridge

volumes:
  keloola-ticketing-pgdata: 